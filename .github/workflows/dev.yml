# Sovereign workflow for the dev environment only.
# Path filters + working-directory ensure this job never touches uat/ or prod/.
name: terraform-dev

on:
  pull_request:
    paths:
      - "dev/**"
      - ".github/workflows/dev.yml"
  push:
    branches: [main]
    paths:
      - "dev/**"
      - ".github/workflows/dev.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKING_DIR: dev

jobs:
  plan:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      # PoC CI uses -backend=false so fmt/validate/plan run without AWS.
      # Real pipelines should terraform init against the env S3 key with env-scoped creds.
      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

  apply:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve
