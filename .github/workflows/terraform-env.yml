name: terraform-env

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.filter.outputs.dev }}
      uat: ${{ steps.filter.outputs.uat }}
      prod: ${{ steps.filter.outputs.prod }}
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Detect changed environments
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dev:
              - 'dev/**'
            uat:
              - 'uat/**'
            prod:
              - 'prod/**'

  setup:
    runs-on: ubuntu-latest
    needs: changes
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      terraform_version: ${{ steps.build.outputs.terraform_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build matrix from ci-config.json
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENV: ${{ inputs.environment }}
          CHANGED_DEV: ${{ needs.changes.outputs.dev }}
          CHANGED_UAT: ${{ needs.changes.outputs.uat }}
          CHANGED_PROD: ${{ needs.changes.outputs.prod }}
        run: |
          set -euo pipefail
          CONFIG=".github/ci-config.json"
          TF_VERSION=$(jq -r '.terraform_version' "$CONFIG")
          echo "terraform_version=${TF_VERSION}" >> "$GITHUB_OUTPUT"

          VALID_ENVS=$(jq -r '.environments | keys | join(", ")' "$CONFIG")

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "${DISPATCH_ENV:-}" ] || ! jq -e --arg e "$DISPATCH_ENV" '.environments | has($e)' "$CONFIG" >/dev/null; then
              echo "::error::Invalid or blank environment '${DISPATCH_ENV:-}'. Valid environments: ${VALID_ENVS}"
              exit 1
            fi
            MATRIX=$(jq -c --arg e "$DISPATCH_ENV" '
              .environments
              | to_entries
              | map(select(.key == $e))
              | {include: map({env: .key, path: .value.path, state_key: .value.state_key})}
            ' "$CONFIG")
          else
            CHANGED='[]'
            [ "$CHANGED_DEV" = "true" ] && CHANGED=$(echo "$CHANGED" | jq -c '. + ["dev"]')
            [ "$CHANGED_UAT" = "true" ] && CHANGED=$(echo "$CHANGED" | jq -c '. + ["uat"]')
            [ "$CHANGED_PROD" = "true" ] && CHANGED=$(echo "$CHANGED" | jq -c '. + ["prod"]')

            MATRIX=$(jq -c --argjson changed "$CHANGED" '
              .environments
              | to_entries
              | map(select(.key as $k | $changed | index($k)))
              | {include: map({env: .key, path: .value.path, state_key: .value.state_key})}
            ' "$CONFIG")
          fi

          # Validate matrix values before emitting (trusted constants for downstream jobs)
          SAFE_RE='^[a-z0-9][a-z0-9_-]*$'
          INCLUDE_COUNT=$(echo "$MATRIX" | jq '.include | length')
          if [ "$INCLUDE_COUNT" -gt 0 ]; then
            for i in $(seq 0 $((INCLUDE_COUNT - 1))); do
              ENV_NAME=$(echo "$MATRIX" | jq -r --argjson i "$i" '.include[$i].env')
              ENV_PATH=$(echo "$MATRIX" | jq -r --argjson i "$i" '.include[$i].path')

              if [[ ! "$ENV_NAME" =~ $SAFE_RE ]]; then
                echo "::error::Invalid env name '${ENV_NAME}': must match ${SAFE_RE}"
                exit 1
              fi
              if ! jq -e --arg e "$ENV_NAME" '.environments | has($e)' "$CONFIG" >/dev/null; then
                echo "::error::env '${ENV_NAME}' is not a key in ci-config.json .environments"
                exit 1
              fi
              if [[ ! "$ENV_PATH" =~ $SAFE_RE ]]; then
                echo "::error::Invalid path '${ENV_PATH}' for env '${ENV_NAME}': must match ${SAFE_RE}"
                exit 1
              fi
              EXPECTED_PATH=$(jq -r --arg e "$ENV_NAME" '.environments[$e].path' "$CONFIG")
              if [ "$ENV_PATH" != "$EXPECTED_PATH" ]; then
                echo "::error::path '${ENV_PATH}' for env '${ENV_NAME}' does not match ci-config.json (.environments.${ENV_NAME}.path='${EXPECTED_PATH}')"
                exit 1
              fi
            done
          fi

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Built matrix: ${MATRIX}"

  fmt:
    runs-on: ubuntu-latest
    needs: setup
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.setup.outputs.terraform_version }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    needs: setup
    if: github.event_name == 'pull_request' && needs.setup.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ENV_PATH: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.setup.outputs.terraform_version }}

      - name: Terraform init (no backend)
        run: terraform -chdir="$ENV_PATH" init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir="$ENV_PATH" validate

  plan:
    runs-on: ubuntu-latest
    needs: [setup, validate]
    if: github.event_name == 'pull_request' && needs.setup.outputs.matrix != '{"include":[]}'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ENV_NAME: ${{ matrix.env }}
      ENV_PATH: ${{ matrix.path }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEV_DEPLOY_ROLE_ARN: ${{ secrets.DEV_DEPLOY_ROLE_ARN }}
      UAT_DEPLOY_ROLE_ARN: ${{ secrets.UAT_DEPLOY_ROLE_ARN }}
      PROD_DEPLOY_ROLE_ARN: ${{ secrets.PROD_DEPLOY_ROLE_ARN }}
    steps:
      - name: Guard deploy role ARN
        run: |
          set -euo pipefail
          case "$ENV_NAME" in
            dev)  DEPLOY_ROLE_ARN="${DEV_DEPLOY_ROLE_ARN:-}" ;;
            uat)  DEPLOY_ROLE_ARN="${UAT_DEPLOY_ROLE_ARN:-}" ;;
            prod) DEPLOY_ROLE_ARN="${PROD_DEPLOY_ROLE_ARN:-}" ;;
            *)    DEPLOY_ROLE_ARN="" ;;
          esac
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "::error::Missing secret <ENV>_DEPLOY_ROLE_ARN for '${ENV_NAME}'. Set it in repo Settings → Secrets. See PR body for manual setup."
            exit 1
          fi
          echo "DEPLOY_ROLE_ARN=${DEPLOY_ROLE_ARN}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-ci-${{ env.ENV_NAME }}-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.setup.outputs.terraform_version }}

      - name: Terraform init
        run: terraform -chdir="$ENV_PATH" init -input=false

      - name: Terraform plan
        id: plan
        run: |
          set -euo pipefail
          terraform -chdir="$ENV_PATH" plan -out="tfplan-${ENV_NAME}" -input=false -no-color 2>&1 | tee "plan-${ENV_NAME}.txt"
          # Move plan file to workspace root for artifact upload
          mv "$ENV_PATH/tfplan-${ENV_NAME}" "tfplan-${ENV_NAME}"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: tfplan-${{ env.ENV_NAME }}
          retention-days: 5

      - name: Post / update plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            const marker = `<!-- tf-plan-${env} -->`;
            let plan = '';
            try {
              plan = fs.readFileSync(`plan-${env}.txt`, 'utf8');
            } catch (e) {
              plan = '(plan output unavailable)';
            }
            const max = 60000;
            if (plan.length > max) {
              plan = plan.slice(0, max) + '\n... (truncated)';
            }
            const body = [
              marker,
              `### Terraform plan (\`${env}\`)`,
              '',
              '<details>',
              '<summary>Plan output</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    runs-on: ubuntu-latest
    needs: setup
    if: >
      needs.setup.outputs.matrix != '{"include":[]}' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    permissions:
      contents: read
      id-token: write
    environment: ${{ matrix.env }}
    concurrency:
      group: tf-env-${{ matrix.env }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ENV_NAME: ${{ matrix.env }}
      ENV_PATH: ${{ matrix.path }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEV_DEPLOY_ROLE_ARN: ${{ secrets.DEV_DEPLOY_ROLE_ARN }}
      UAT_DEPLOY_ROLE_ARN: ${{ secrets.UAT_DEPLOY_ROLE_ARN }}
      PROD_DEPLOY_ROLE_ARN: ${{ secrets.PROD_DEPLOY_ROLE_ARN }}
    steps:
      - name: Guard deploy role ARN
        run: |
          set -euo pipefail
          case "$ENV_NAME" in
            dev)  DEPLOY_ROLE_ARN="${DEV_DEPLOY_ROLE_ARN:-}" ;;
            uat)  DEPLOY_ROLE_ARN="${UAT_DEPLOY_ROLE_ARN:-}" ;;
            prod) DEPLOY_ROLE_ARN="${PROD_DEPLOY_ROLE_ARN:-}" ;;
            *)    DEPLOY_ROLE_ARN="" ;;
          esac
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "::error::Missing secret <ENV>_DEPLOY_ROLE_ARN for '${ENV_NAME}'. Set it in repo Settings → Secrets. See PR body for manual setup."
            exit 1
          fi
          echo "DEPLOY_ROLE_ARN=${DEPLOY_ROLE_ARN}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-ci-${{ env.ENV_NAME }}-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.setup.outputs.terraform_version }}

      - name: Terraform init
        run: terraform -chdir="$ENV_PATH" init -input=false

      - name: Terraform apply
        run: terraform -chdir="$ENV_PATH" apply -auto-approve -input=false
