# Sovereign workflow for the prod environment only.
# Path filters + working-directory ensure this job never touches dev/ or uat/.
# Configure GitHub Environment "prod" with multiple required reviewers for apply/destroy.
name: terraform-prod

on:
  pull_request:
    paths:
      - "prod/**"
      - ".github/workflows/prod.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKING_DIR: prod

jobs:
  plan:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    # Multi-reviewer gate: set required reviewers on GitHub Environment "prod".
    environment: prod
    defaults:
      run:
        working-directory: prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve
